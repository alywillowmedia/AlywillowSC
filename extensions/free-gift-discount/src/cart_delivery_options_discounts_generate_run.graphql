query DeliveryInput {
  cart {
    selectedReward: attribute(key: "_awc_reward_choice") {
      value
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      freeGift: attribute(key: "_awc_free_gift") {
        value
      }
    }
    deliveryGroups {
      id
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:free-gift-discount", key: "function-configuration") {
      jsonValue
    }
  }
}
